apiVersion: v1
kind: Secret
metadata:
  name: users-db-secret
  namespace: default
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-db
  namespace: default
  labels:
    app: users-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
        - name: users-db
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: users_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: users-db-storage
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: users-db-storage
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  # Nombre exacto que espera validate_cluster.sh del evaluador.
  name: users-db-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: users-db
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-app
  namespace: default
  labels:
    app: users-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-app
  template:
    metadata:
      labels:
        app: users-app
    spec:
      initContainers:
        - name: wait-for-users-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z users-db-service 5432; do echo waiting for users-db-service; sleep 2; done
      containers:
        - name: users-app
          image: users_app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: DB_HOST
              # El nombre del Service de su propia base es el hostname DNS.
              value: users-db-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: users_db
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: users-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /users/ping
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /users/ping
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  # Nombre exacto que espera validate_cluster.sh del evaluador.
  name: users-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: users-app
  ports:
    - port: 9000
      targetPort: 9000

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  # Nombre exacto que espera validate_networks.sh; cualquier otro se reporta
  # como "Unexpected NetworkPolicy" y además falta el esperado.
  name: users-network
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: users-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: users-app
      ports:
        - protocol: TCP
          port: 5432
