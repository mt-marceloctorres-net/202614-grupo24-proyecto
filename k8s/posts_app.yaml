apiVersion: v1
kind: Secret
metadata:
  name: posts-db-secret
  namespace: default
type: Opaque
stringData:
  POSTGRES_PASSWORD: postgres

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-db
  namespace: default
  labels:
    app: posts-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts-db
  template:
    metadata:
      labels:
        app: posts-db
    spec:
      containers:
        - name: posts-db
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: posts_db
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: posts-db-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: posts-db-volumen
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: posts-db-volumen
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: posts-db-service
  namespace: default
  labels:
    app: posts-db
spec:
  type: ClusterIP
  selector:
    app: posts-db
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: posts-app
  namespace: default
  labels:
    app: posts-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: posts-app
  template:
    metadata:
      labels:
        app: posts-app
    spec:
      initContainers:
        - name: wait-for-posts-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - until nc -z posts-db-service 5432; do echo waiting for posts-db-service; sleep 2; done
      containers:
        - name: posts-app
          image: posts_app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          env:
            - name: DB_HOST
              value: posts-db-service
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: posts_db
            - name: DB_USER
              value: postgres
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: posts-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          readinessProbe:
            httpGet:
              path: /posts/ping
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /posts/ping
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: posts-app-service
  namespace: default
  labels:
    app: posts-app
spec:
  type: NodePort
  selector:
    app: posts-app
  ports:
    - port: 80
      targetPort: 9000
      nodePort: 30001

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: posts-network
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: posts-db
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: posts-app
      ports:
        - protocol: TCP
          port: 5432
