name: Evaluador Pruebas Unitarias
# Actualice este pipeline si usted decide trabajar en una tecnología diferente a Python.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  # pets_app queda comentado: era solo el ejemplo del curso (nunca tuvo
  # cobertura >70%, se queda en rojo a propósito). users_app ya es la
  # referencia real. Descomentar si en algún momento hace falta de nuevo.
  # pets_app:
  #   runs-on: ubuntu-latest
  #   name: Verify pets_app
  #   strategy:
  #     fail-fast: true
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Set up Python
  #       uses: actions/setup-python@v5
  #       with:
  #         python-version: 3.11
  #     - name: Set up Poetry
  #       uses: abatilo/actions-poetry@v3
  #       with:
  #         poetry-version: 2.1.1
  #     - name: Run linter checkers in pets_app
  #       run: make lintcheck DIR=pets_app
  #     - name: Run unit tests
  #       run: make unittest DIR=pets_app

  users_app:
    runs-on: ubuntu-latest
    name: Verify users_app
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: 2.1.1
      - name: Run linter checkers in users_app
        run: make lintcheck DIR=users_app
      - name: Run unit tests
        run: make unittest DIR=users_app
        run: make unittest DIR=pets_app

  routes_app:
    runs-on: ubuntu-latest
    name: Verify routes_app
    strategy:
      fail-fast: true
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11
      - name: Set up Poetry
        uses: abatilo/actions-poetry@v3
        with:
          poetry-version: 2.1.1
      - name: Run linter checkers in routes_app
        run: make lintcheck DIR=routes_app
      - name: Run unit tests
        run: make unittest DIR=routes_app